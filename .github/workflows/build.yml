
name: Build OmniPOS Windows (.exe)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --ignore-scripts

      - name: Setup Visual Studio C++ Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Rebuild Native Dependencies
        run: npx electron-builder install-app-deps
        env:
          GYP_MSVS_VERSION: 2022

      - name: Build Windows Application
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify EXE Installer
        shell: pwsh
        run: |
          $files = Get-ChildItem "release" -Filter "*.exe"
          if ($files.Count -eq 0) {
            throw "Windows installer was not generated"
          }
          $files | ForEach-Object {
            Write-Host "Generated: $($_.FullName)"
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: OmniPOS-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
